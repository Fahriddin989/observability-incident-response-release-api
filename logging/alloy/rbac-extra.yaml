apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-kubernetes-logs-extra
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - namespaces
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-kubernetes-logs-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-kubernetes-logs-extra
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
